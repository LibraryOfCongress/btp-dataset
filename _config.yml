# Book settings
title: By the People Comprehensive Transcription Data Package
html:
  favicon: _static/favicon.png
  use_repository_button: true
  extra_footer: |
    <header class="loc-header">
        <div class="loc-logo">
            <a href="https://www.loc.gov/"><img id="lc-logo" alt="The Library of Congress logo" title="Go to the Library of Congress homepage" /></a>
        </div>
        <div class="project-description">
            <p>This site describes the By the People Comprehensive Transcription Data Package, with a tutorial on fetching and analyzing the data. <a href="https://github.com/LibraryOfCongress/btp-dataset" class="button small">View the code</a></p>
        </div>
    </header>
    <footer class="loc-footer">
        <ul class="loc-footer-nav-list">
            <li><a href="https://github.com/LibraryOfCongress/btp-dataset">Source code</a></li>  
            <li><a href="https://www.loc.gov/">The Library of Congress</a></li>
            <li><a href="https://loc.gov/legal">Privacy Policy</a></li>
            <li><a href="https://www.loc.gov/accessibility/">Accessibility</a></li>
            <li><a href="https://docs.github.com/en/site-policy/privacy-policies/github-privacy-statement">Github Privacy Statement</a></li>
            <li><a href="https://creativecommons.org/publicdomain/zero/1.0/">License</a></li>
            <li><a href="https://ask.loc.gov/crowd">Contact</a></li>
        </ul>
        <div
          id="sr-announcer"
          aria-live="polite"
          aria-atomic="true"
          class="sr-only"
        ></div>
    </footer>
    <script>
        const repo_base = window.location.pathname.split('/')[1];
        document.getElementById('lc-logo').src = "/" + repo_base + '/_static/LOC_Logo_horiz_inv.png';
        const themeSwitchButton = document.querySelector('.theme-switch-button')
        if (themeSwitchButton) {themeSwitchButton.remove();}
    </script>

# The following values assume that you are executing the notebooks yourself before you build
# Re-execution of notebooks are turned off since these scripts take a very long time to (re-)build
# Look here for more options: https://jupyterbook.org/en/stable/content/execute.html
execute:
  execute_notebooks: "off"
  stderr_output: remove

# All of the fields below are required to add a link to the source repo
sphinx:
  recursive_update: true
  config:
    html_theme_options:
      repository_provider: "https://github.com"
    html_context:
      github_url: https://github.com/LibraryOfCongress
      github_repo: btp-dataset
      github_user: ""
      github_version: main
      doc_path: source

repository:
  url: https://github.com/LibraryOfCongress/btp-dataset
