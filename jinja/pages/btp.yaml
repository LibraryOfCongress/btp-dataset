template: ./jinja/templates/at_a_glance_template.md.j2
output: ./01_at_a_glance.md
dataset_name: "By the People Comprehensive Transcription Data Package"
description: "The **By the People Comprehensive Transcription Data Package** provides access to Library of Congress digital pages transcribed by public volunteers, through the Library of Congress’s [By the People](https://crowd.loc.gov/) crowdsourced transcription program. The dataset combines full text transcripts from contributors, tags from contributors, selected metadata fields from Library of Congress staff, and URL pointers to download images as [IIIF](https://www.loc.gov/apis/micro-services/image-services/) JPEG, JP2, and/or TIFF. Read more about the data at {doc}`02_about`. Info about downloading the data is at {doc}`03_download`."
total_records: "425,077"
total_files: "73"
total_size: "3.0"
total_size_unit: "GB"
has_metadata: True
has_images: False
has_transcriptions: True
has_audio: False
has_video: False
has_webarchives: False
is_dehydrated: True
dehydrated_types: "images"
charts:
  - title: "Campaigns by page count"
    aria-label: "Raw data CSV, Campaigns by page count"
    type: bar_horizontal
    chart_data: ./_static/data/btp_agg_bar_h_document_count_by_campaign.csv
    width:
    height: 1500
  - title: "Original Format by page count"
    aria-label: "Raw data CSV, Original Format by page count"
    subtitle: "Values are from the dataset's `OriginalFormat` field, which is a multi-value field."
    type: bar_horizontal
    chart_data: ./_static/data/btp_agg_original_format.csv
    width:
    height: 260
  - title: "Distribution of pages by word count"
    aria-label: "Raw data CSV, Distribution of pages by word count"
    type: bar_vertical
    chart_data: ./_static/data/btp_agg_vbar_words_per_doc.csv
    width:
    height: 380
  - title: "Campaigns by total unique word count"
    aria-label: "Raw data CSV, Campaigns by total unique word count"
    subtitle: 'Uniqueness is determined by word root. Words like "running", "ran", "runs" are considered the same word.'
    type: bar_horizontal
    chart_data: ./_static/data/btp_agg_bar_h_word_count_by_campaign.csv
    width:
    height: 1400
  - title: "Top 20 Contributors"
    aria-label: "Raw data CSV, Top 20 Contributors"
    subtitle: "Values are from the dataset's `Contributor` field, which is a multi-value field. Ordered by page count."
    type: bar_horizontal
    chart_data: ./_static/data/btp_agg_top_contributors.csv
    width:
    height: 900
  - title: "Page count by image format"
    subtitle: "Each page may have up to three formats available: JPEG, JP2, TIFF."
    aria-label: "Raw data CSV, Image formats counts"
    type: bar_horizontal
    chart_data: ./_static/data/btp_agg_image_formats.csv
    width:
    height: 190
